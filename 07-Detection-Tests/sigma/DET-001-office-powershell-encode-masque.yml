title: Office lançant PowerShell encodé et masqué
id: 245ddfbb-4a9c-5177-a458-03ad7306fe1f
status: experimental
description: 'Un processus Office engendre powershell.exe avec une commande encodée et une fenêtre masquée (observé : winword.exe -> powershell.exe
  -enc ... -w hidden). [DET-001 | fondement : DIRECTE | artefacts : ALERT-001, journal l.1]'
references:
- alerte ALERT-001
author: Équipe CTI (challenge fictif Helios)
date: '2026-10-06'
tags:
- attack.execution
- attack.t1059.001
- attack.stealth
- attack.t1564.003
logsource:
  category: process_creation
  product: windows
detection:
  parent:
    ParentImage|endswith:
    - winword.exe
    - excel.exe
    - powerpnt.exe
  ps:
    Image|endswith: powershell.exe
  enc:
    CommandLine|contains:
    - -enc
    - -encodedcommand
  hid:
    CommandLine|contains:
    - -w hidden
    - -windowstyle hidden
  condition: parent and ps and enc and hid
falsepositives:
- Macros légitimes d'automatisation ouvrant PowerShell (rare avec -enc ET fenêtre masquée)
level: high
