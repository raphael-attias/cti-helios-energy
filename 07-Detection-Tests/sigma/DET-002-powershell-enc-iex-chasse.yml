title: 'Chasse : PowerShell encodé dont le préfixe décodé est IEX'
id: 318a6dbf-21da-5af6-9cb8-37746aa46ea5
status: experimental
description: 'Le préfixe base64 SQBFAFgA se décode (UTF-16LE) en IEX. Règle de CHASSE complémentaire : ne prouve aucune technique observée à elle
  seule. [DET-002 | fondement : CHASSE | artefacts : ALERT-001]'
references:
- alerte ALERT-001
author: Équipe CTI (challenge fictif Helios)
date: '2026-10-06'
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  ps:
    Image|endswith: powershell.exe
  enc:
    CommandLine|contains|all:
    - -enc
    - SQBFAFgA
  condition: ps and enc
falsepositives:
- Scripts d'administration encodés commençant par IEX
level: medium
